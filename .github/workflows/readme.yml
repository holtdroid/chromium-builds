name: readme

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: readme

jobs:
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Icons
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil >/dev/null
          if git fetch -q --depth 1 origin icons; then
            git worktree add -q icons FETCH_HEAD
          else
            git worktree add -q --orphan -b icons icons
          fi
          scripts/icons.sh icons
      - run: |
          rm -rf icons/badges
          scripts/readme.sh README.md icons
      - name: Publish icons and badges
        working-directory: icons
        run: |
          [[ -e .git ]] || exit 0
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm 'icons: update'
          git push -q origin HEAD:refs/heads/icons
      - name: Commit
        run: |
          git diff --quiet README.md && exit 0
          git commit -qm 'docs: update the release table' README.md
          for _ in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1
